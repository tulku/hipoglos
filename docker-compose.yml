services:
  hipoglos:
    image: ghcr.io/${GH_USER:-tulku}/hipoglos:latest
    # For local development, build instead:
    #   build:
    #     context: .
    #     dockerfile: Dockerfile
    container_name: hipoglos
    restart: unless-stopped
    volumes:
      - ./hipoglos_client_secret.json:/app/hipoglos_client_secret.json:ro
      - ./config.toml:/app/config.toml
      - ./data:/app/data
    environment:
      - RUST_LOG=info

    # Run setup directly on the server (recommended — writes tokens into ./data):
    #   docker compose run --rm hipoglos setup
    #
    # To force the manual paste flow (usually automatic inside container):
    #   MANUAL_AUTH=1 docker compose run --rm hipoglos setup
    #
    # ( --network host is only needed if you want the automatic redirect listener
    #   instead of manual code paste. Manual paste requires no port forwards.)
    #
    # sync: runs normally
    #   docker compose up -d
